<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Brainrot Empire</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0c0d18;color:#fff;font-family:Arial,sans-serif}
.app{max-width:560px;margin:auto;min-height:100vh;padding:14px;background:radial-gradient(circle at 50% 15%,#40306f 0,#15152a 38%,#090a12 100%)}
header{display:flex;justify-content:space-between;align-items:center}.logo{font-size:26px;font-weight:900}.reset{background:#ffffff12;color:#fff;border:1px solid #ffffff18;border-radius:12px;padding:9px}
.money{text-align:center;margin-top:18px;font-size:34px;font-weight:900}.per{text-align:center;color:#aaa;font-size:13px}
.main{margin:15px 0;background:#ffffff0d;border:1px solid #ffffff16;border-radius:28px;padding:20px;text-align:center}
.level{font-size:12px;color:#bbb}.orb{width:240px;height:240px;margin:16px auto;border-radius:50%;background:linear-gradient(145deg,#ffef5a,#ff55a6 55%,#704dff);display:flex;align-items:center;justify-content:center;font-size:105px;box-shadow:0 22px 60px #0008;cursor:pointer;transition:.08s;user-select:none}.orb:active{transform:scale(.91)}.orb img{width:92%;height:92%;object-fit:contain;filter:drop-shadow(0 18px 18px #0007)}
.tap{font-weight:800;color:#ddd}.xp{height:9px;background:#0008;border-radius:20px;margin:12px 0;overflow:hidden}.xp div{height:100%;background:linear-gradient(90deg,#ffdc45,#ff61b0,#8e6cff);width:0}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tabs button{border:0;border-radius:15px;padding:12px 4px;background:#ffffff0e;color:#aaa;font-weight:800}.tabs .on{background:#ffffff20;color:#fff}
.panel{display:none;margin-top:10px;background:#ffffff0d;border:1px solid #ffffff16;border-radius:22px;padding:15px}.panel.on{display:block}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#0004;border-radius:16px;padding:12px;margin:8px 0}.row b{display:block}.row small{color:#999}.buy{border:0;border-radius:11px;padding:10px 12px;background:#ffd94d;font-weight:900}.buy:disabled{opacity:.3}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.item{padding:13px;background:#0004;border-radius:17px;text-align:center}.face{font-size:45px}.locked{opacity:.35;filter:grayscale(1)}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#171722eF;border:1px solid #ffffff18;padding:12px 18px;border-radius:14px;opacity:0;transition:.2s}.toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">🧠 Brainrot Empire</div><button class="reset" onclick="resetGame()">↻</button></header>
<div class="money" id="money">0 🪙</div><div class="per">+<span id="cps">0</span> 🪙 / сек</div>
<section class="main">
<div class="level">УРОВЕНЬ <b id="lvl">1</b> • <span id="progressText">0 / 100 тапов</span></div>
<div class="orb" onclick="tap()"><img id="heroImg" src="assets/tung_tung.png" alt=""></div>
<div class="tap">+<span id="tap">1</span> 🪙 за тап</div>
<div class="xp"><div id="xp"></div></div>
</section>
<div class="tabs"><button class="on" onclick="tab('shop',this)">🛒 Магазин</button><button onclick="tab('collection',this)">📖 Коллекция</button><button onclick="tab('rebirth',this)">♻️ Rebirth</button></div>
<section class="panel on" id="shop"><h2>Магазин</h2><div id="shopList"></div></section>
<section class="panel" id="collection"><h2>Коллекция</h2><div class="grid" id="grid"></div></section>
<section class="panel" id="rebirth"><h2>♻️ Rebirth</h2><p style="color:#aaa">Сбрось прогресс и получи постоянный бонус.</p><div class="row"><div><b>Осколки</b><small id="shards">0</small></div><div>×<span id="mult">1.0</span></div></div><button class="buy" style="width:100%" id="rebirthBtn" onclick="rebirth()">Сделать Rebirth</button><p style="color:#777;font-size:12px">Требуется 10 уровень.</p></section>
</div><div class="toast" id="toast"></div>
<script>
const bs=[
['Tung Tung Sahur','assets/tung_tung.png',0,1],
['Brr Brr Patapim','assets/patapim.png',100,4],
['Tralalero Tralala','assets/tralalero.png',700,18],
['Bombardiro Crocodilo','assets/bombardiro.png',5000,80],
['Chimpanzini Bananini','assets/chimpanzini.png',40000,350],
['Cappuccino Assassino','assets/cappuccino.png',350000,1800],
['Lirili Larila','assets/lirili.png',4000000,10000],
['Boneca Ambalabu','assets/boneca.png',50000000,65000]
];
const ups=[
['tap','💪 Сильный тап','+1 к тапу',25],
['auto','⚙️ Автоматизация','+2 🪙/сек',60],
['multi','🔥 Мега-мозг','×1.25 ко всему',500]
];
let s=JSON.parse(localStorage.brainrotEmpire||'null')||{money:0,taps:0,lvl:1,owned:1,shards:0,multi:1,u:{tap:0,auto:0,multi:0},last:Date.now()};
function save(){s.last=Date.now();localStorage.brainrotEmpire=JSON.stringify(s)}
function fmt(n){if(n<1000)return Math.floor(n);let a=['K','M','B','T'];let i=-1;while(n>=1000&&i<3){n/=1000;i++}return n.toFixed(n<10?1:0)+a[i]}
function cps(){let x=0;for(let i=0;i<s.owned;i++)x+=bs[i][3];x+=s.u.auto*2;return x*s.multi*(1+s.shards*.1)}
function tap(){s.money+=(1+s.u.tap)*s.multi*(1+s.shards*.1);s.taps++;let need=s.lvl*100;if(s.taps>=need){s.lvl++;s.money+=s.lvl*50;toast('🎉 Новый уровень! +'+s.lvl*50+' 🪙')}save();render()}
function cost(u){return Math.floor(u[3]*Math.pow(2,s.u[u[0]]))}
function buy(k){let u=ups.find(x=>x[0]===k),c=cost(u);if(s.money<c)return;s.money-=c;s.u[k]++;if(k==='multi')s.multi*=1.25;save();render()}
function brain(i){if(i<s.owned)return;let c=bs[i][2];if(s.money<c){toast('Не хватает монет');return}s.money-=c;s.owned=i+1;save();render();toast('🧠 Новый Brainrot!')}
function rebirth(){if(s.lvl<10){toast('Нужен 10 уровень');return}let gain=Math.max(1,Math.floor(s.lvl/10));s.shards+=gain;s.money=0;s.taps=0;s.lvl=1;s.owned=1;s.u={tap:0,auto:0,multi:0};s.multi=1;save();render();toast('♻️ Rebirth! +'+gain+' осколок')}
function render(){
heroImg.src=bs[Math.max(0,s.owned-1)][1];money.textContent=fmt(s.money)+' 🪙';cpsEl.textContent=fmt(cps());lvl.textContent=s.lvl;tapEl.textContent=fmt((1+s.u.tap)*s.multi*(1+s.shards*.1));
let prev=(s.lvl-1)*100,need=s.lvl*100;pct=Math.min(100,Math.max(0,(s.taps-prev)/(need-prev)*100));xp.style.width=pct+'%';progressText.textContent=s.taps+' / '+need+' тапов';
shopList.innerHTML=ups.map(u=>{let c=cost(u);return `<div class="row"><div><b>${u[1]}</b><small>${u[2]} • ур. ${s.u[u[0]]}</small></div><button class="buy" ${s.money<c?'disabled':''} onclick="buy('${u[0]}')">${fmt(c)} 🪙</button></div>`}).join('');
shopList.innerHTML+='<h3>🧠 Brainrot</h3>'+bs.map((b,i)=>`<div class="row ${i>=s.owned?'locked':''}"><div style="display:flex;align-items:center;gap:10px"><img src="${b[1]}" style="width:58px;height:58px;object-fit:contain"><div><b>${i<s.owned?b[0]:'???'}</b><small>${i<s.owned?'+'+fmt(b[3])+' 🪙/сек':'Новый генератор'}</small></div></div><button class="buy" ${i<s.owned||s.money<b[2]?'disabled':''} onclick="brain(${i})">${i<s.owned?'✓':fmt(b[2])+' 🪙'}</button></div>`).join('');
grid.innerHTML=bs.map((b,i)=>`<div class="item ${i>=s.owned?'locked':''}"><div class="face"><img src="${b[1]}" style="width:100%;height:130px;object-fit:contain"></div><b>${i<s.owned?b[0]:'???'}</b><small>${i<s.owned?'Открыт':'Заблокирован'}</small></div>`).join('');
shards.textContent=s.shards;mult.textContent=(1+s.shards*.1).toFixed(1);rebirthBtn.disabled=s.lvl<10;
}
function tab(id,el){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');el.classList.add('on')}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>x.classList.remove('show'),1500)}
function resetGame(){if(confirm('Сбросить весь прогресс?')){localStorage.removeItem('brainrotEmpire');location.reload()}}
const money=document.getElementById('money'),cpsEl=document.getElementById('cps'),lvl=document.getElementById('lvl'),tapEl=document.getElementById('tap');
let off=Math.min((Date.now()-s.last)/1000,28800);if(off>5){s.money+=cps()*off;setTimeout(()=>toast('💤 Оффлайн доход +'+fmt(cps()*off)+' 🪙'),100)}
setInterval(()=>{s.money+=cps();save();render()},1000);render();
</script>
</body></html>
